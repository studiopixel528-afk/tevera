<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tevera</title>
  <style>
    :root { --bg:#fff; --text:#111; --msg:#f1f1f1; --msg-own:#007bff; --border:#ddd; --side:#f7f7f7; }
    body.dark { --bg:#1a1a1a; --text:#eee; --msg:#2a2a2a; --msg-own:#0066cc; --border:#333; --side:#222; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }

    #login-screen { position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; justify-content:center; }
    #login-box { background:var(--side); padding:30px; border-radius:12px; border:1px solid var(--border); width:320px; text-align:center; }
    #login-box h2 { margin-top:0; }
    #login-input { width:100%; padding:10px; font-size:14px; margin-bottom:10px; }
    #login-err { color:#e74c3c; font-size:12px; margin:8px 0; min-height:16px; }
    #login-btn { width:100%; padding:10px; cursor:pointer; }

    #app { display:none; width:100%; display:flex; }
    #sidebar { width:250px; flex-shrink:0; background:var(--side); border-right:1px solid var(--border); display:flex; flex-direction:column; }
    #sidebar-head { display:flex; align-items:center; justify-content:space-between; padding:10px; font-weight:bold; border-bottom:1px solid var(--border); }
    #add-btn { font-size:22px; line-height:1; border:none; background:none; color:var(--text); cursor:pointer; padding:0 6px; }
    #search-row { padding:8px 10px; border-bottom:1px solid var(--border); }
    #user-search { width:100%; padding:5px; }
    #search-results { display:none; padding:6px 10px; border-bottom:1px solid var(--border); }
    .user-hit { padding:6px; cursor:pointer; border-radius:6px; }
    .user-hit:hover { background:var(--msg); }
    #who { padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; }
    #who b { color:var(--msg-own); }
    #chat-list { flex:1; overflow-y:auto; }
    .chat-item { padding:12px 10px; cursor:pointer; border-bottom:1px solid var(--border); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .chat-item:hover { background:var(--msg); }
    .chat-item.active { background:var(--msg-own); color:#fff; }

    #new-chat-box { display:none; padding:8px; border-bottom:1px solid var(--border); }
    #new-chat-type { display:flex; gap:6px; margin-bottom:6px; }
    #new-chat-type button { flex:1; padding:5px; cursor:pointer; border:1px solid var(--border); background:var(--msg); color:var(--text); border-radius:6px; }
    #new-chat-type button.selected { background:var(--msg-own); color:#fff; }
    #new-chat-name { width:100%; padding:6px; }
    .member-option { display:flex; align-items:center; gap:8px; padding:6px 8px; cursor:pointer; }
    .member-option:hover { background:var(--msg); }
    .member-option img { width:24px; height:24px; border-radius:50%; object-fit:cover; }
    .member-option span { font-size:13px; }

    #main { flex:1; display:flex; flex-direction:column; min-width:0; }
    #chat-title { padding:12px 14px; font-weight:bold; font-size:16px; border-bottom:1px solid var(--border); background:var(--bg); display:flex; align-items:center; justify-content:space-between; }
    #call-btn { font-size:18px; border:none; background:none; color:var(--text); cursor:pointer; padding:4px 8px; }
    #chat-toolbar { display:flex; justify-content:flex-end; gap:8px; padding:8px 10px; border-bottom:1px solid var(--border); }
    #chat-toolbar button { padding:6px 12px; cursor:pointer; }

    #messages { flex:1; overflow-y:auto; padding:10px; }
    .msg-wrap { position:relative; display:flex; flex-direction:column; align-items:flex-start; }
    .msg { margin:6px 0; padding:8px 12px; background:var(--msg); color:var(--text); border-radius:8px; max-width:70%; overflow-wrap:break-word; }
    .msg-wrap.own { align-items:flex-end; }
    .msg-wrap.own .msg { margin-left:auto; background:var(--msg-own); color:#fff; }
    .msg-sender { font-size:11px; opacity:0.7; margin-bottom:2px; }

    .del-btn { display:none; border:none; cursor:pointer; padding:4px 10px; background:#e74c3c; color:#fff; border-radius:6px; font-size:12px; margin-top:2px; }
    .msg-wrap.selected .del-btn { display:inline-block; }

    .play-btn { border:none; cursor:pointer; padding:6px 12px; border-radius:6px; font-size:13px; background:var(--msg); color:var(--text); border:1px solid var(--border); }

    #composer { display:flex; gap:8px; padding:10px; border-top:1px solid var(--border); align-items:center; }
    #mic-btn { font-size:20px; padding:6px 10px; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:var(--msg); }
    #mic-btn.recording { background:#e74c3c; color:#fff; }
    #input { flex:1; padding:8px; font-size:14px; }
    button { padding:8px 16px; cursor:pointer; }

    #call-panel { display:none; position:fixed; inset:0; background:var(--bg); z-index:200; align-items:center; justify-content:center; gap:24px; flex-direction:column; }
    #call-avatar { font-size:64px; background:var(--msg); width:120px; height:120px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
    #call-status { font-size:22px; font-weight:bold; text-align:center; }
    #call-controls { display:flex; gap:40px; align-items:center; }
    #call-panel button { width:72px; height:72px; cursor:pointer; border-radius:50%; border:none; font-size:30px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
    #call-answer { background:#2ecc71; color:#fff; }
    #call-answer:hover { background:#27ae60; }
    #call-end { background:#e74c3c; color:#fff; }
    #call-end:hover { background:#c0392b; }

    /* Аватарки */
    .avatar { width:40px; height:40px; border-radius:50%; object-fit:cover; background:var(--msg); flex-shrink:0; }
    .chat-item { display:flex; align-items:center; gap:10px; }
    #who { display:flex; align-items:center; gap:10px; }
    #avatar-input { display:none; }
    #my-avatar { max-width:60px; max-height:60px; border-radius:50%; object-fit:cover; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div id="login-box">
      <h2>Добро пожаловать</h2>
      <p style="font-size:13px;">Придумайте свой юзернейм (например @WEST)</p>
      <input type="file" id="login-avatar-input" accept="image/*" style="display:none;">
      <div style="display:flex; justify-content:center; margin:10px 0;">
        <img id="login-avatar" onclick="document.getElementById('login-avatar-input').click()" title="Выберите аватарку" style="width:80px; height:80px; border-radius:50%; object-fit:cover; cursor:pointer; border:2px solid var(--border); background:var(--msg);">
      </div>
      <p style="font-size:12px; color:var(--text); opacity:0.7; margin:0 0 10px;">Выберите аватарку (кликните по кружку)</p>
      <input id="login-input" placeholder="Введите юзернейм..." maxlength="30">
      <div id="login-err"></div>
      <button id="login-btn">Войти</button>
    </div>
  </div>

  <div id="app">
    <div id="sidebar">
      <div id="sidebar-head"><span>Чаты</span><button id="add-btn" title="Добавить чат">+</button></div>
      <div id="search-row"><input id="user-search" placeholder="🔍 Найти по юзернейму..."></div>
      <div id="search-results"></div>
      <div id="who">
        <input type="file" id="avatar-input" accept="image/*" style="display:none;">
        <img id="my-avatar" title="Нажмите, чтобы сменить аватарку" onclick="document.getElementById('avatar-input').click()" style="cursor:pointer;">
        <div>Вы вошли как <b id="my-name"></b></div>
      </div>
      <div id="new-chat-box">
        <div id="new-chat-type"><button data-type="channel">Канал</button><button data-type="group" class="selected">Группа</button></div>
        <input id="new-chat-name" placeholder="Введите название...">
        <div id="member-select" style="display:none; max-height:120px; overflow-y:auto; border:1px solid var(--border); margin-top:6px; border-radius:6px;">
          <div style="padding:4px 8px; font-size:11px; opacity:0.7;">Выберите участников:</div>
        </div>
      </div>
      <div id="chat-list"></div>
    </div>

    <div id="main">
      <div id="chat-title">
        <span id="chat-title-text">Главный чат</span>
        <button id="call-btn" title="Позвонить">📞</button>
      </div>
      <div id="chat-toolbar"><button id="theme-btn">🌙 Тёмная</button></div>
      <div id="messages"></div>
      <div id="composer">
        <button id="mic-btn">🎤</button>
        <input id="input" placeholder="Введите сообщение...">
        <button id="send">Отправить</button>
      </div>
    </div>
  </div>

  <div id="call-panel">
    <div id="call-avatar">👤</div>
    <div id="call-status">Звонок...</div>
    <div id="call-controls">
      <button id="call-answer" style="display:none;" title="Ответить">📞</button>
      <button id="call-end" title="Сбросить">📞</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const lsUsersKey = 'tevera-users';
    const lsSelfKey = 'tevera-self';

    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const themeBtn = document.getElementById('theme-btn');
    const micBtn = document.getElementById('mic-btn');
    const chatList = document.getElementById('chat-list');
    const chatTitleText = document.getElementById('chat-title-text');
    const callBtn = document.getElementById('call-btn');
    const addBtn = document.getElementById('add-btn');
    const newChatBox = document.getElementById('new-chat-box');
    const newChatName = document.getElementById('new-chat-name');
    const memberSelect = document.getElementById('member-select');
    const typeButtons = document.querySelectorAll('#new-chat-type button');
    const loginScreen = document.getElementById('login-screen');
    const loginInput = document.getElementById('login-input');
    const loginBtn = document.getElementById('login-btn');
    const loginErr = document.getElementById('login-err');
    const loginAvatar = document.getElementById('login-avatar');
    const loginAvatarInput = document.getElementById('login-avatar-input');
    const userSearch = document.getElementById('user-search');
    const searchResults = document.getElementById('search-results');
    const myNameEl = document.getElementById('my-name');
    const myAvatarEl = document.getElementById('my-avatar');
    const avatarInput = document.getElementById('avatar-input');
    const callPanel = document.getElementById('call-panel');
    const callStatus = document.getElementById('call-status');
    const callAnswer = document.getElementById('call-answer');
    const callEnd = document.getElementById('call-end');

    let allUsers = [];
    try { allUsers = JSON.parse(localStorage.getItem(lsUsersKey)) || []; } catch (e) { allUsers = []; }
    let myName = '';
    const chats = [];
    let currentChat = null;
    let selectedType = 'group';
    let socket = null;

    function saveUsers() { localStorage.setItem(lsUsersKey, JSON.stringify(allUsers)); }
    function normalize(u) { return (u || '').trim().replace(/^@/, '').replace(/\s+/g, ' '); }
    function peerName(chat) { return (chat.name || '').replace(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F02F}]+ ?/u, '').trim(); }

    function enterApp() {
      loginScreen.style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      myNameEl.textContent = myName;
      connectServer();
      chats.length = 0;
      createChat('Главный чат', 'group');
    }

    loginBtn.onclick = () => {
      const name = normalize(loginInput.value);
      if (!name) { loginErr.textContent = 'Введите юзернейм'; return; }
      loginBtn.disabled = true;
      const attempt = () => {
        try {
          socket = io();
        } catch (e) {
          loginBtn.disabled = false;
          loginErr.textContent = 'Сервер недоступен';
          return;
        }
        socket.emit('try-register', name, (res) => {
          if (res && res.ok) {
            myName = res.username;
            localStorage.setItem(lsSelfKey, myName);
            if (loginAvatarData) {
              myAvatarEl.src = loginAvatarData;
              socket.emit('set-avatar', { avatar: loginAvatarData });
            }
            enterApp();
          } else {
            socket.close();
            loginBtn.disabled = false;
            loginErr.textContent = 'Этот юзернейм уже занят';
          }
        });
      };
      attempt();
    };
    loginInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.onclick(); });

    const savedSelf = localStorage.getItem(lsSelfKey);
    if (savedSelf) {
      // Попытка восстановить сессию: подключаемся и регистрируем сохранённое имя, но имени могло уже не быть
      try { socket = io(); } catch (e) { socket = null; }
      if (socket) {
        socket.emit('try-register', savedSelf, (res) => {
          if (res && res.ok) {
            myName = res.username;
            enterApp();
          } else {
            localStorage.removeItem(lsSelfKey);
            if (socket) socket.close();
          }
        });
      }
    }

    function createChat(name, type, members) {
      const chat = { name: (type === 'channel' ? '📢 ' : '👥 ') + name, type: type, owner: myName, members: members || [], messages: [] };
      chats.push(chat);
      renderChats();
      openChat(chat);
    }
    function renderChats() {
      chatList.innerHTML = '';
      chats.forEach((chat) => {
        const item = document.createElement('div');
        item.className = 'chat-item' + (chat === currentChat ? ' active' : '');
        const img = document.createElement('img');
        img.className = 'avatar';
        const peer = peerName(chat);
        img.src = (chat.type === 'group' && userAvatars[peer.toLowerCase()]) ? userAvatars[peer.toLowerCase()] : myDefaultAvatar;
        const nameSpan = document.createElement('span');
        nameSpan.textContent = chat.name;
        item.appendChild(img);
        item.appendChild(nameSpan);
        item.onclick = () => openChat(chat);
        chatList.appendChild(item);
      });
    }
    function canWrite(chat) {
      if (!chat) return false;
      if (chat.type === 'channel') return chat.owner.toLowerCase() === myName.toLowerCase();
      return true;
    }
    function openChat(chat) {
      currentChat = chat;
      chatTitleText.textContent = chat.name;
      renderChats();
      renderMessages();
    }
    function renderMessages() {
      messages.innerHTML = '';
      if (!currentChat) return;
      currentChat.messages.forEach((m) => {
        if (m.type === 'audio') appendAudio(m.url, m.own, m.sender);
        else appendText(m.text, m.own, m.sender);
      });
      messages.scrollTop = messages.scrollHeight;
    }

    function connectServer() {
      if (!socket) {
        try { socket = io(); } catch (e) { return; }
      }
      socket.emit('register', myName);
      if (socket._hooked) return;
      socket._hooked = true;
      socket.on('message', (data) => {
        const target = chats.find((c) => peerName(c).toLowerCase() === String(data.from).toLowerCase());
        if (!target) return;
        if (data.audio !== undefined && data.audio !== null && data.audio !== '') {
          let url = data.audio;
          try {
            const bytes = new Uint8Array(data.audio);
            const blob = new Blob([bytes], { type: data.audioMime || 'audio/webm' });
            url = URL.createObjectURL(blob);
          } catch (e) {
            url = typeof data.audio === 'string' ? data.audio : url;
          }
          target.messages.push({ type: 'audio', url: url, own: false, sender: data.from });
        } else {
          target.messages.push({ type: 'text', text: data.text || '', own: false, sender: data.from });
        }
        if (target === currentChat) renderMessages();
      });
      socket.on('incoming-call', (data) => { currentPeer = data.from; caller = false; callAnswer.style.display = 'flex'; callEnd.innerHTML = '📞'; callStatus.textContent = 'Входящий звонок от @' + data.from; callPanel.style.display = 'flex'; });
      socket.on('call-offer', (data) => { currentPeer = data.from; answerOffer(data.offer); });
      socket.on('call-answer', (data) => { if (pc) pc.setRemoteDescription(new RTCSessionDescription(data.answer)); });
      socket.on('ice-candidate', (data) => { if (pc) pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(() => {}); });
      socket.on('call-ended', () => endCallUI());
      socket.on('user-list', (list) => {
        if (list && list.users) { onlineUsers = list.users || []; userAvatars = list.avatars || {}; }
        else { onlineUsers = list || []; userAvatars = {}; }
        renderChats();
      });
      socket.on('my-avatar', (a) => { if (myAvatarEl) myAvatarEl.src = a || myDefaultAvatar; });
    }

    let pc = null, localStream = null, inCall = false, caller = false, currentPeer = '', callTimer = null, pendingAnswer = null;

    callBtn.onclick = () => {
      if (inCall || !socket) { alert('Сервер не подключён или идёт звонок'); return; }
      const peer = peerName(currentChat);
      if (!peer) { alert('Выберите чат с собеседником'); return; }
      currentPeer = peer; caller = true;
      callAnswer.style.display = 'none';
      callEnd.innerHTML = '📞';
      callStatus.textContent = 'Звонок @' + peer + '...';
      callPanel.style.display = 'flex';
      socket.emit('call-user', { to: peer, from: myName });
      makeOffer();
    };
    callAnswer.onclick = () => {
      callAnswer.style.display = 'none';
      callEnd.innerHTML = '📞';
      if (socket && pendingAnswer) socket.emit('call-answer', { to: currentPeer, from: myName, answer: pendingAnswer });
      startCallTimer();
    };
    callEnd.onclick = () => { if (socket && currentPeer) socket.emit('call-end', { to: currentPeer, from: myName }); endCallUI(); };

    function endCallUI() {
      callPanel.style.display = 'none';
      callAnswer.style.display = 'none';
      clearInterval(callTimer);
      if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
      if (pc) { pc.close(); pc = null; }
      inCall = false;
      callEnd.innerHTML = '📞';
    }
    function startCallTimer() {
      let sec = 0;
      clearInterval(callTimer);
      callTimer = setInterval(() => { sec++; if (inCall) { const m = String(Math.floor(sec/60)).padStart(2,'0'); const s = String(sec%60).padStart(2,'0'); callStatus.textContent = 'Звонок с @' + currentPeer + '  ' + m + ':' + s; } }, 1000);
    }
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

    async function makeOffer() {
      inCall = true;
      pc = new RTCPeerConnection(rtcConfig);
      setupPeer();
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      if (socket) socket.emit('call-offer', { to: currentPeer, from: myName, offer: offer });
    }
    async function answerOffer(offer) {
      inCall = true;
      pc = new RTCPeerConnection(rtcConfig);
      setupPeer();
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      pendingAnswer = await pc.createAnswer();
      await pc.setLocalDescription(pendingAnswer);
    }
    function setupPeer() {
      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => { localStream = stream; stream.getTracks().forEach((t) => pc.addTrack(t, stream)); }).catch((e) => alert('Нет микрофона: ' + e.message));
      const remoteAudio = new Audio();
      remoteAudio.autoplay = true;
      remoteAudio.id = 'remote-audio';
      pc.ontrack = (ev) => {
        remoteAudio.srcObject = ev.streams[0];
        remoteAudio.play().catch(() => {});
      };
      pc.onicecandidate = (e) => { if (e.candidate && socket) socket.emit('ice-candidate', { to: currentPeer, from: myName, candidate: e.candidate }); };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') {
          callAnswer.style.display = 'none';
          startCallTimer();
        } else if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
          if (inCall) { if (socket && currentPeer) socket.emit('call-end', { to: currentPeer, from: myName }); endCallUI(); }
        }
      };
    }

    function senderAvatar(sender) {
      return userAvatars[String(sender || '').toLowerCase()] || myDefaultAvatar;
    }

    function appendText(text, own, sender) {
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap' + (own ? ' own' : '');
      if (!own) {
        const head = document.createElement('div');
        head.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:2px;';
        const av = document.createElement('img'); av.className = 'avatar'; av.style.width='24px'; av.style.height='24px'; av.src = senderAvatar(sender);
        const s = document.createElement('span'); s.className = 'msg-sender'; s.textContent = '@' + sender;
        head.appendChild(av); head.appendChild(s);
        wrap.appendChild(head);
      }
      const d = document.createElement('div'); d.className = 'msg'; d.textContent = text;
      const del = document.createElement('button'); del.className = 'del-btn'; del.textContent = 'Удалить';
      del.onclick = () => wrap.remove();
      wrap.appendChild(d); wrap.appendChild(del); attachHoldToDelete(wrap);
      messages.appendChild(wrap); messages.scrollTop = messages.scrollHeight;
    }
    function appendAudio(url, own, sender) {
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap' + (own ? ' own' : '');
      if (!own) {
        const head = document.createElement('div');
        head.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:2px;';
        const av = document.createElement('img'); av.className = 'avatar'; av.style.width='24px'; av.style.height='24px'; av.src = senderAvatar(sender);
        const s = document.createElement('span'); s.className = 'msg-sender'; s.textContent = '@' + sender;
        head.appendChild(av); head.appendChild(s);
        wrap.appendChild(head);
      }
      const play = document.createElement('button'); play.className = 'play-btn'; play.textContent = '▶ Воспроизвести';
      const audio = document.createElement('audio'); audio.src = url;
      play.onclick = () => audio.paused ? audio.play() : audio.pause();
      const del = document.createElement('button'); del.className = 'del-btn'; del.textContent = 'Удалить';
      del.onclick = () => wrap.remove();
      wrap.appendChild(play); wrap.appendChild(del); attachHoldToDelete(wrap);
      messages.appendChild(wrap); messages.scrollTop = messages.scrollHeight;
    }
    let pressTimer = null;
    function attachHoldToDelete(wrap) {
      wrap.addEventListener('mousedown', (e) => { if (e.button !== 0) return; clearTimeout(pressTimer); pressTimer = setTimeout(() => wrap.classList.add('selected'), 600); });
      wrap.addEventListener('mouseup', () => clearTimeout(pressTimer));
      wrap.addEventListener('mouseleave', () => clearTimeout(pressTimer));
    }
    messages.addEventListener('mousedown', (e) => {
      if (!e.target.closest('.msg-wrap') && e.button === 0) { clearTimeout(pressTimer); document.querySelectorAll('.msg-wrap.selected').forEach((w) => w.classList.remove('selected')); }
    });

    function sendMsg() {
      const t = input.value.trim();
      if (!t || !currentChat) return;
      const peer = peerName(currentChat);
      if (socket && peer) socket.emit('message', { to: peer, from: myName, text: t });
      appendText(t, true);
      currentChat.messages.push({ type: 'text', text: t, own: true, sender: myName });
      input.value = '';
    }
    function sendAll() {
      if (!currentChat) return;
      if (recordedBlob) {
        const peer = peerName(currentChat);
        const url = URL.createObjectURL(recordedBlob);
        appendAudio(url, true, myName);
        if (currentChat) currentChat.messages.push({ type: 'audio', url: url, own: true, sender: myName });
        if (socket && peer) {
          recordedBlob.arrayBuffer().then((buf) => {
            socket.emit('message', { to: peer, from: myName, audio: buf, audioMime: recordedBlob.type || 'audio/webm' });
          });
        }
        recordedBlob = null;
      } else {
        sendMsg();
      }
    }
    send.addEventListener('click', sendAll);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });

    function fillMemberSelect() {
      memberSelect.innerHTML = '';
      const title = document.createElement('div');
      title.style.cssText = 'padding:4px 8px; font-size:11px; opacity:0.7;';
      title.textContent = 'Выберите участников:';
      memberSelect.appendChild(title);
      const candidates = onlineUsers.filter((u) => u.toLowerCase() !== myName.toLowerCase());
      if (candidates.length === 0) {
        const none = document.createElement('div');
        none.style.cssText = 'padding:4px 8px; font-size:12px; opacity:0.6;';
        none.textContent = 'Нет доступных друзей (никто не онлайн)';
        memberSelect.appendChild(none);
      } else {
        candidates.forEach((u) => {
          const label = document.createElement('label');
          label.className = 'member-option';
          const cb = document.createElement('input');
          cb.type = 'checkbox'; cb.value = u; cb.className = 'member-cb';
          const img = document.createElement('img');
          img.src = userAvatars[u.toLowerCase()] || myDefaultAvatar;
          const sp = document.createElement('span'); sp.textContent = '@' + u;
          label.appendChild(cb); label.appendChild(img); label.appendChild(sp);
          memberSelect.appendChild(label);
        });
      }
    }

    addBtn.onclick = () => {
      newChatBox.style.display = newChatBox.style.display === 'none' ? 'block' : 'none';
      if (newChatBox.style.display === 'block') {
        newChatName.focus();
        if (selectedType === 'group') { memberSelect.style.display = 'block'; fillMemberSelect(); }
        else memberSelect.style.display = 'none';
      }
    };
    typeButtons.forEach((b) => { b.onclick = () => { typeButtons.forEach((x) => x.classList.remove('selected')); b.classList.add('selected'); selectedType = b.dataset.type; if (newChatBox.style.display === 'block') { if (selectedType === 'group') { memberSelect.style.display = 'block'; fillMemberSelect(); } else memberSelect.style.display = 'none'; } }; });
    newChatName.addEventListener('keydown', (e) => { if (e.key === 'Enter' && newChatName.value.trim()) {
      const members = Array.from(document.querySelectorAll('.member-cb:checked')).map((c) => c.value);
      createChat(newChatName.value.trim(), selectedType, members);
      newChatName.value = '';
      newChatBox.style.display = 'none';
      memberSelect.style.display = 'none';
    } });

    let onlineUsers = [];
    let userAvatars = {};
    const myDefaultAvatar = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#ccc"/><text x="50" y="55" font-size="40" text-anchor="middle" fill="#fff">👤</text></svg>');
    myAvatarEl.src = myDefaultAvatar;
    let loginAvatarData = null;
    loginAvatar.src = myDefaultAvatar;

    loginAvatarInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { loginAvatar.src = reader.result; loginAvatarData = reader.result; };
      reader.readAsDataURL(file);
      loginAvatarInput.value = '';
    };

    avatarInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        myAvatarEl.src = reader.result;
        if (socket) socket.emit('set-avatar', { avatar: reader.result });
      };
      reader.readAsDataURL(file);
      avatarInput.value = '';
    };

    userSearch.addEventListener('input', () => {
      const q = normalize(userSearch.value).toLowerCase();
      searchResults.innerHTML = '';
      if (!q) { searchResults.style.display = 'none'; return; }
      const hits = onlineUsers.filter((u) => u.toLowerCase().includes(q) && u.toLowerCase() !== myName.toLowerCase());
      if (hits.length === 0) { const none = document.createElement('div'); none.textContent = 'Никого не найдено'; none.style.cssText = 'color:#e74c3c;font-size:12px;'; searchResults.appendChild(none); }
      else { hits.forEach((u) => { const hit = document.createElement('div'); hit.className = 'user-hit'; hit.textContent = '@' + u; hit.onclick = () => { createChat(u, 'group'); userSearch.value = ''; searchResults.style.display = 'none'; searchResults.innerHTML = ''; }; searchResults.appendChild(hit); }); }
      searchResults.style.display = 'block';
    });

    let mediaRecorder = null, recordedBlob = null, recordingChunks = [];
    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        recordingChunks = [];
        mediaRecorder.ondataavailable = (e) => recordingChunks.push(e.data);
        mediaRecorder.onstop = () => { recordedBlob = new Blob(recordingChunks, { type: mediaRecorder.mimeType }); };
        mediaRecorder.start();
        micBtn.classList.add('recording'); micBtn.textContent = '⏹';
      } catch (err) { alert('Нет доступа к микрофону: ' + err.message); }
    }
    micBtn.onclick = () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); micBtn.classList.remove('recording'); micBtn.textContent = '🎤'; }
      else startRecording();
    };

    function applyTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      themeBtn.textContent = theme === 'dark' ? '☀️ Светлая' : '🌙 Тёмная';
    }
    applyTheme(localStorage.getItem('tevera-theme') || 'light');
    themeBtn.onclick = () => {
      const isDark = document.body.classList.contains('dark');
      const next = isDark ? 'light' : 'dark';
      localStorage.setItem('tevera-theme', next);
      applyTheme(next);
    };
  </script>
</body>
</html>
